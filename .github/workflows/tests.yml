name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  formula:
    strategy:
      matrix:
        os: [ macos-15 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    env:
      # CI tests this tap's own checkout, so skip the third-party trust prompt.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew style ackertyson/hype
      - run: brew audit --strict --online --formula ackertyson/hype/hype
      - run: brew install --build-from-source ackertyson/hype/hype
      - run: brew test ackertyson/hype/hype
