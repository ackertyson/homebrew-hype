name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  formula:
    strategy:
      matrix:
        os: [ macos-15 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Install first: installing by fully-qualified name trusts the formula,
      # which audit and test need before they will load it.
      # Only the formula: tap-wide style also holds the release scripts to
      # Homebrew's own shell style.
      - run: brew style ackertyson/hype/hype
      - run: brew install ackertyson/hype/hype
      - run: brew audit --strict --online --formula ackertyson/hype/hype
      - run: brew test ackertyson/hype/hype
